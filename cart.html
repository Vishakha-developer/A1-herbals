
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shopping Cart | A1 Herbals</title>

    <link rel="stylesheet" href="../css/products.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        .cart-section {
            max-width: 1200px;
            margin: 60px auto;
            padding: 0 25px;
        }

        .cart-heading {
            margin-bottom: 35px;
        }

        .cart-heading h1 {
            font-size: 34px;
            margin-bottom: 10px;
        }

        .cart-container {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 30px;
        }

        .cart-items {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .cart-item {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 20px;
            border: 1px solid #e5e5e5;
            border-radius: 10px;
        }

        .cart-item img {
            width: 100px;
            height: 100px;
            object-fit: contain;
        }

        .cart-item-info {
            flex: 1;
        }

        .cart-item-info h3 {
            margin-bottom: 8px;
        }

        .cart-item-price {
            color: #198754;
            font-weight: 700;
        }

        .quantity-controls {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 12px;
        }

        .quantity-controls button {
            width: 30px;
            height: 30px;
            border: 1px solid #198754;
            background: white;
            color: #198754;
            cursor: pointer;
            border-radius: 4px;
        }

        .remove-item {
            border: none;
            background: none;
            color: #dc3545;
            cursor: pointer;
            font-size: 18px;
        }

        .cart-summary {
            padding: 25px;
            border: 1px solid #e5e5e5;
            border-radius: 10px;
            height: fit-content;
        }

        .cart-summary h2 {
            margin-bottom: 25px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin: 18px 0;
        }

        .checkout-btn {
            width: 100%;
            padding: 15px;
            background: #198754;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 15px;
        }

        .empty-cart {
            text-align: center;
            padding: 60px 20px;
        }

        .empty-cart i {
            font-size: 55px;
            color: #198754;
            margin-bottom: 20px;
        }

        .empty-cart a {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 25px;
            background: #198754;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        @media (max-width: 768px) {
            .cart-container {
                grid-template-columns: 1fr;
            }

            .cart-item {
                flex-wrap: wrap;
            }
        }
    </style>

</head>

<body>

    <!-- Header -->
    <header class="main-header">

        <div class="logo">
            <a href="../index.html">A1 <span>Herbals</span></a>
        </div>

        <nav class="navbar">
            <a href="../index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="products.html">Our Products</a>
            <a href="contact.html">Contact Us</a>
        </nav>

        <div class="header-icons">
            <a href="profile.html">
                <i class="fa-regular fa-user"></i>
            </a>

            <a href="cart.html">
                <i class="fa-solid fa-cart-shopping"></i>
            </a>
        </div>

    </header>

    <!-- Cart Section -->
    <section class="cart-section">

        <div id="cartContent">

            <div class="empty-cart">

                <i class="fa-solid fa-cart-shopping"></i>

                <h2>Your Cart is Empty</h2>

                <p>You haven't added any products yet.</p>

                <a href="products.html">Continue Shopping</a>

            </div>

        </div>

    </section>

    <script src="../js/cart.js"></script>
</body>
</html>
