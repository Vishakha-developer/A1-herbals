
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password | A1 Herbals</title>

    <link rel="stylesheet" href="../css/login.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

    <div class="login-container">

        <!-- Left Section -->
        <div class="login-left">

            <a href="../index.html" class="logo">
                <i class="fa-solid fa-leaf"></i>
                A1 Herbals
            </a>

            <div class="login-left-content">
                <h1>Create New Password</h1>

                <p>
                    Choose a strong password to keep your A1 Herbals
                    account safe and secure.
                </p>
            </div>

            <div class="login-decoration">
                <i class="fa-solid fa-shield-halved"></i>
            </div>

        </div>


        <!-- Right Section -->
        <div class="login-right">

            <div class="login-form-container">

                <h2>Reset Your Password</h2>

                <p class="login-subtitle">
                    Enter your new password below
                </p>

                <form id="resetPasswordForm">

                    <!-- New Password -->
                    <div class="form-group">

                        <label for="newPassword">New Password</label>

                        <div class="input-box">

                            <i class="fa-solid fa-lock"></i>

                            <input
                                type="password"
                                id="newPassword"
                                placeholder="Enter new password"
                                minlength="8"
                                required>

                        </div>

                    </div>


                    <!-- Confirm Password -->
                    <div class="form-group">

                        <label for="confirmPassword">Confirm Password</label>

                        <div class="input-box">

                            <i class="fa-solid fa-lock"></i>

                            <input
                                type="password"
                                id="confirmPassword"
                                placeholder="Confirm new password"
                                minlength="8"
                                required>

                        </div>

                    </div>


                    <p id="resetMessage"
                        style="margin-bottom: 15px; font-size: 14px;">
                    </p>


                    <!-- Reset Button -->
                    <button type="submit" class="login-btn" id="resetPasswordBtn">

                        Reset Password
                        <i class="fa-solid fa-arrow-right"></i>

                    </button>

                </form>


                <div class="register-link">
                    Remember your password?
                    <a href="login.html">Back to Login</a>
                </div>


                <a href="../index.html" class="back-home">
                    <i class="fa-solid fa-arrow-left"></i>
                    Back to Home
                </a>

            </div>

        </div>

    </div>


    <script src="../js/reset-password.js"></script>

</body>
</html>
